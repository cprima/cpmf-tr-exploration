[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cprima-raumtube"
version = "0.0.1"
description = "UPnP audio bridge for Teufel Raumfeld devices"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "async-upnp-client>=0.40.0",
]

[project.optional-dependencies]
youtube = ["yt-dlp>=2024.0.0"]
dev     = ["pytest>=8.0", "ruff>=0.9", "mypy>=1.10", "hypothesis>=6.100"]

[project.scripts]
raumtube-discover = "cli.discover:main"
raumtube-play     = "cli.play:main"
raumtube-enqueue  = "cli.enqueue:main"
raumtube-dequeue  = "cli.dequeue:main"
raumtube-scpd     = "cli.scpd:main"
raumtube-model    = "cli.model:main"
raumtube-dev      = "cli.dev:main"
raumtube-browse   = "cli.browse:main"
raumtube-fav      = "cli.fav:main"
raumtube-button   = "cli.button:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cprima_raumtube", "cli", "emulator"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9", "mypy>=1.10", "hypothesis>=6.100"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PIE", "RET", "ARG", "DTZ", "TCH", "PERF"]
ignore = ["E501", "B008", "RUF022"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_any_generics = true
no_implicit_optional = true
strict_equality = true
exclude = ["^\\.venv/", "^build/"]
